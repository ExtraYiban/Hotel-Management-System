{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reservasi{% endblock %} | Nocturn Haven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dashboard/css/home.css' %}">
    <link rel="stylesheet" href="{% static 'reservations/css/reservations.css' %}">
</head>
<body class="reservation-page">
    <header class="site-header">
        <a class="brand" href="{% url 'home' %}"><span class="brand-mark">N</span><span><strong>NOCTURN</strong><small>HAVEN</small></span></a>
        <nav class="main-nav" aria-label="Navigasi utama"><a href="{% url 'home' %}">Home</a><a class="active" href="{% url 'room_list' %}">Room &amp; Suites</a><a href="{% url 'home' %}#facilities">Facilities</a><a href="{% url 'home' %}#offers">Offers</a></nav>
        {% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="button btn btn-danger button-dark" type="submit">Keluar</button></form>{% else %}<a class="button btn btn-danger button-dark" href="{% url 'login' %}">Masuk</a>{% endif %}
    </header>
    <main class="reservation-main">
        <div class="reservation-container">
            <p class="eyebrow">Nocturn Haven <span></span> Pengalaman menginap yang tenang</p>
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
