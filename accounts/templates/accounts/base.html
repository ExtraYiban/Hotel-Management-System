{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Akun{% endblock %} | Nocturn Haven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dashboard/css/home.css' %}">
    <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
</head>
<body class="auth-page">
    <header class="site-header"><a class="brand" href="{% url 'home' %}"><img class="brand-logo" src="{% static 'dashboard/images/logo.svg' %}" alt="Nocturn Haven"></a><a class="text-link" href="{% url 'home' %}">Kembali ke beranda</a></header>
    <main class="auth-main"><section class="auth-card"><img class="auth-logo" src="{% static 'dashboard/images/logo.svg' %}" alt="Nocturn Haven">{% block content %}{% endblock %}</section></main>
</body>
</html>
